<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 1.5rem;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
        }
        a {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
            display: block;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
        }
        a:hover {
            background-color: #2563eb;
            color: white;
            border-color: #2563eb;
            transform: translateY(-2px);
        }
        a::after {
            content: "→";
        }
    </style>
</head>
<body>

<div class="container">
    <h2>My Dashboard</h2>
    <ul>
        <li><a href="https://chatgpt.com" target="_blank">ChatGPT</a></li>
        <li><a href="https://aistudio.google.com" target="_blank">Google AI Studio</a></li>
        <li><a href="https://grok.com/" target="_blank">Grok</a></li>
        <!-- Bạn có thể thêm các trang khác ở đây -->
    </ul>
</div>

</body>
</html>
